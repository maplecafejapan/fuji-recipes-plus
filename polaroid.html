<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161311" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>拍立得 · 富士食譜工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sumi: #161311; --char: #2b2622; --paper: #f4eee4; --ink: #2a2218;
      --cream: #f6efe4; --muted: #9b8f82; --fuji: #e60012; --line: rgba(255,255,255,.08);
      --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: #161311; color: var(--cream); font-family: "Noto Sans TC", sans-serif; }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(900px 420px at 80% -10%, rgba(230,0,18,.14), transparent 55%);
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .top {
      position: sticky; top: 0; z-index: 10;
      padding: calc(12px + var(--safe-t)) 16px 12px;
      display: flex; align-items: center; gap: 10px;
      background: color-mix(in srgb, var(--sumi) 82%, transparent);
      backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
    }
    .brand { flex: 1; }
    .brand h1 { margin: 0; font-family: "Noto Serif JP", serif; font-size: 18px; letter-spacing: .16em; }
    .pbtn {
      border: 0; min-height: 40px; padding: 0 14px; border-radius: 999px;
      background: var(--paper); color: var(--ink); font-weight: 700; text-decoration: none;
      display: inline-grid; place-items: center;
    }
    .pbtn.red { background: var(--fuji); color: #fff; }
    .pbtn.ghost { background: transparent; color: var(--cream); box-shadow: inset 0 0 0 1px var(--line); }
    .pbtn.full { width: 100%; }
    .wrap { padding: 16px; max-width: 740px; margin: 0 auto; padding-bottom: calc(28px + var(--safe-b)); }
    .drop {
      border: 1px dashed #6a5f55; border-radius: 16px; min-height: 120px;
      display: grid; place-items: center; text-align: center; color: var(--muted);
      background: var(--char); margin-bottom: 16px; animation: rise .4s ease;
    }
    .stage { display: grid; place-items: center; min-height: 280px; margin: 8px 0 18px; }
    .polaroid {
      width: min(88vw, 420px); background: #f7f3ec;
      padding: 4.6% 4.6% 0; box-shadow: 0 18px 40px rgba(0,0,0,.45);
      transform: rotate(-1.2deg); animation: drop .55s cubic-bezier(.2,1.1,.3,1);
    }
    .polaroid.ready { animation: pop .45s ease; }
    .polaroid img, .polaroid canvas { width: 100%; display: block; background: #ddd; }
    .caption {
      min-height: 72px; padding: 12px 2px 16px;
      display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
      color: #2c261e; font-size: 11px; letter-spacing: .04em;
    }
    .caption b { display: block; font-size: 12px; }
    .caption .r { text-align: right; font-variant-numeric: tabular-nums; }
    .form { display: grid; gap: 10px; }
    label.field { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
    .field input {
      width: 100%; border: 0; background: var(--char); border-radius: 12px; padding: 11px 12px;
      box-shadow: inset 0 0 0 1px var(--line); outline: none;
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 10px; }
    .shutter { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
    .shutter.go { animation: flash .42s ease; }
    .hidden { display: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px);} to { opacity: 1; transform: none;} }
    @keyframes drop { from { opacity: 0; transform: translateY(-24px) rotate(-6deg) scale(.96);} to { opacity: 1; transform: rotate(-1.2deg) scale(1);} }
    @keyframes pop { from { transform: rotate(-1.2deg) scale(.98);} to { transform: rotate(-1.2deg) scale(1);} }
    @keyframes flash { 0%{opacity:0} 20%{opacity:1} 100%{opacity:0} }
  </style>
</head>
<body>
  <div class="shutter" id="shutter"></div>
  <header class="top">
    <a class="pbtn ghost" href="./">返回</a>
    <div class="brand"><h1>拍立得</h1></div>
  </header>
  <div class="wrap">
    <label class="drop" id="drop">點這裡上傳照片<br><small>建議用相機 JPEG</small>
      <input class="hidden" id="file" type="file" accept="image/*" />
    </label>
    <div class="stage">
      <div class="polaroid" id="frame">
        <canvas id="photo" width="1200" height="900"></canvas>
        <div class="caption">
          <div><b id="t-cam">相機 / 鏡頭</b><span id="t-lens">上傳後自動讀取</span></div>
          <div class="r"><b id="t-exp">ISO · f/ · 快門</b></div>
        </div>
      </div>
    </div>
    <div class="form">
      <div class="row2">
        <label class="field">相機<input id="cam" placeholder="X-T50"></label>
        <label class="field">鏡頭<input id="lens" placeholder="XF35mmF1.4 R"></label>
      </div>
      <div class="row2">
        <label class="field">ISO<input id="iso" placeholder="400"></label>
        <label class="field">光圈<input id="fnum" placeholder="f/1.4"></label>
      </div>
      <label class="field">快門<input id="shut" placeholder="1/250"></label>
      <button class="pbtn red full" id="save">下載拍立得</button>
    </div>
    <p class="hint">白框底下會留白。EXIF 讀得到就自動填，沒有可以手改。HEIC / RAF 可能讀不到參數。</p>
  </div>
<script>
const $ = s => document.querySelector(s);
const flash = () => { const s=$("#shutter"); s.classList.remove("go"); void s.offsetWidth; s.classList.add("go"); };
let source = null, orient = 1;

function drawPreview(){
  const c = $("#photo");
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#d9d0c4";
  ctx.fillRect(0,0,c.width,c.height);
  if(!source) return;
  const {w,h} = naturalSize(source, orient);
  c.width = 1200;
  c.height = Math.round(1200 * h / w);
  ctx.fillStyle = "#111";
  ctx.fillRect(0,0,c.width,c.height);
  drawOriented(ctx, source, orient, c.width, c.height);
}

function naturalSize(img, o){
  const swap = o>=5 && o<=8;
  return { w: swap ? img.naturalHeight : img.naturalWidth, h: swap ? img.naturalWidth : img.naturalHeight };
}
function drawOriented(ctx, img, o, dw, dh){
  ctx.save();
  switch(o){
    case 2: ctx.translate(dw,0); ctx.scale(-1,1); break;
    case 3: ctx.translate(dw,dh); ctx.rotate(Math.PI); break;
    case 4: ctx.translate(0,dh); ctx.scale(1,-1); break;
    case 5: ctx.rotate(.5*Math.PI); ctx.scale(1,-1); break;
    case 6: ctx.translate(dw,0); ctx.rotate(.5*Math.PI); break;
    case 7: ctx.translate(dw,dh); ctx.rotate(.5*Math.PI); ctx.scale(1,-1); break;
    case 8: ctx.translate(0,dh); ctx.rotate(-.5*Math.PI); break;
  }
  const swap = o>=5 && o<=8;
  ctx.drawImage(img, 0, 0, swap?dh:dw, swap?dw:dh);
  ctx.restore();
}

function fmtShutter(v){
  if(!v || !isFinite(v) || v<=0) return "";
  if(v >= 1) return Number(v.toFixed(1)) + "s";
  const d = Math.round(1/v);
  return "1/" + d;
}
function fmtF(v){
  if(!v || !isFinite(v)) return "";
  const n = v>=10 ? v.toFixed(0) : v.toFixed(1);
  return "f/" + n.replace(/\.0$/,"");
}
function cleanCam(make, model){
  model = (model||"").replace(/^FUJIFILM\s+/i,"").trim();
  make = (make||"").trim();
  if(!model && !make) return "";
  if(model && make && !model.toUpperCase().includes(make.split(" ")[0].toUpperCase()) && !/fuji/i.test(make))
    return (make + " " + model).trim();
  return model || make;
}

async function readExif(buf){
  const u8 = new Uint8Array(buf);
  if(u8[0]!==0xFF || u8[1]!==0xD8) return {};
  let off = 2;
  while(off+4 < u8.length){
    if(u8[off]!==0xFF) break;
    const marker = u8[off+1];
    const size = (u8[off+2]<<8) | u8[off+3];
    if(marker===0xE1){
      const start = off+4;
      const head = String.fromCharCode(...u8.slice(start, start+6));
      if(head.startsWith("Exif")) return parseTiff(u8.buffer, start+6);
    }
    if(marker===0xDA) break;
    off += 2 + size;
  }
  return {};
}
function parseTiff(buf, start){
  const v = new DataView(buf);
  const le = String.fromCharCode(v.getUint8(start), v.getUint8(start+1)) === "II";
  const u16 = o => le ? v.getUint16(start+o,true) : v.getUint16(start+o,false);
  const u32 = o => le ? v.getUint32(start+o,true) : v.getUint32(start+o,false);
  const readIFD = (ifdRel) => {
    const n = u16(ifdRel); const tags = {};
    for(let i=0;i<n;i++){
      const e = ifdRel + 2 + i*12;
      const tag = u16(e), type = u16(e+2), count = u32(e+4), valOff = e+8;
      tags[tag] = decode(type, count, valOff, ifdRel);
    }
    return tags;
  };
  const decode = (type, count, valOff, ifdRel) => {
    const inline = count * ({1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8}[type]||1) <= 4;
    let pos = inline ? valOff : u32(valOff);
    if(!inline) pos = pos; // already relative to tiff start
    const at = inline ? valOff : (/*offset from tiff*/ u32(valOff));
    const p = inline ? valOff : u32(valOff);
    const getU16 = () => le ? v.getUint16(start+p,true) : v.getUint16(start+p,false);
    try{
      if(type===2){
        const o = inline ? valOff : u32(valOff);
        let s="";
        for(let i=0;i<count-1;i++){
          const c = v.getUint8(start+o+i); if(!c) break; s+=String.fromCharCode(c);
        }
        return s;
      }
      if(type===3){
        const o = inline ? valOff : u32(valOff);
        const g = i => le ? v.getUint16(start+o+i*2,true) : v.getUint16(start+o+i*2,false);
        return count===1 ? g(0) : Array.from({length:count},(_,i)=>g(i));
      }
      if(type===4){
        const o = inline ? valOff : u32(valOff);
        const g = i => le ? v.getUint32(start+o+i*4,true) : v.getUint32(start+o+i*4,false);
        return count===1 ? g(0) : Array.from({length:count},(_,i)=>g(i));
      }
      if(type===5){
        const o = u32(valOff);
        const n = le ? v.getUint32(start+o,true) : v.getUint32(start+o,false);
        const d = le ? v.getUint32(start+o+4,true) : v.getUint32(start+o+4,false);
        return d ? n/d : 0;
      }
    }catch{ return ""; }
    return "";
  };
  const ifd0pos = u32(4);
  const ifd0 = readIFD(ifd0pos);
  let exif = {};
  if(ifd0[0x8769]) exif = readIFD(ifd0[0x8769]);
  return {
    make: ifd0[0x010F] || "",
    model: ifd0[0x0110] || "",
    orient: ifd0[0x0112] || 1,
    lens: exif[0xA434] || ifd0[0xA434] || "",
    iso: (Array.isArray(exif[0x8827]) ? exif[0x8827][0] : exif[0x8827]) || exif[0x8833] || "",
    fnum: exif[0x829D] || "",
    shut: exif[0x829A] || ""
  };
}

function fillText(){
  const cam = $("#cam").value.trim();
  const lens = $("#lens").value.trim();
  const iso = $("#iso").value.trim();
  const fnum = $("#fnum").value.trim();
  const shut = $("#shut").value.trim();
  $("#t-cam").textContent = cam || "相機";
  $("#t-lens").textContent = lens || "";
  $("#t-exp").textContent = [iso && ("ISO "+iso.replace(/^ISO\s*/i,"")), fnum, shut].filter(Boolean).join("   ") || "ISO · f/ · 快門";
}

async function loadFile(file){
  const buf = await file.arrayBuffer();
  let meta = {};
  try { meta = await readExif(buf); } catch { meta = {}; }
  orient = Number(meta.orient)||1;
  $("#cam").value = cleanCam(meta.make, meta.model);
  $("#lens").value = (meta.lens||"").trim();
  $("#iso").value = meta.iso ? String(meta.iso) : "";
  $("#fnum").value = fmtF(Number(meta.fnum));
  $("#shut").value = typeof meta.shut === "number" ? fmtShutter(meta.shut) : "";
  fillText();
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { source = img; drawPreview(); $("#frame").classList.remove("ready"); void $("#frame").offsetWidth; $("#frame").classList.add("ready"); URL.revokeObjectURL(url); };
  img.src = url;
}

function exportCard(){
  if(!source){ alert("先上傳照片"); return; }
  const photo = $("#photo");
  const side = 56;
  const bottom = 168;
  const w = photo.width + side*2;
  const h = photo.height + side + bottom;
  const out = document.createElement("canvas");
  out.width = w; out.height = h;
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#f7f3ec";
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(photo, side, side);
  ctx.fillStyle = "#2c261e";
  ctx.textBaseline = "top";
  const cam = $("#cam").value.trim();
  const lens = $("#lens").value.trim();
  const iso = $("#iso").value.trim();
  const fnum = $("#fnum").value.trim();
  const shut = $("#shut").value.trim();
  const y = side + photo.height + 28;
  ctx.font = "600 28px 'Noto Sans TC', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(cam || "", side, y);
  ctx.font = "22px 'Noto Sans TC', sans-serif";
  ctx.fillText(lens || "", side, y+36);
  ctx.textAlign = "right";
  ctx.font = "600 24px 'Noto Sans TC', sans-serif";
  ctx.fillText([iso && ("ISO "+iso.replace(/^ISO\s*/i,"")), fnum, shut].filter(Boolean).join("   "), w-side, y+10);
  flash();
  out.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "polaroid.jpg";
    a.click();
  }, "image/jpeg", 0.92);
}

$("#drop").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => { const f=e.target.files[0]; if(f) loadFile(f); e.target.value=""; });
["cam","lens","iso","fnum","shut"].forEach(id => $( "#"+id ).addEventListener("input", fillText));
$("#save").onclick = exportCard;
drawPreview();
</script>
</body>
</html>
